events {}
http {
    # Re-resolve Compose DNS when a service container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream service_one {
        zone service_one 64k;
        server service-one:18081 resolve;
    }
    upstream service_two {
        zone service_two 64k;
        server service-two:18082 resolve;
    }
    server {
        listen 8080;
        # The trailing slash strips the service prefix before forwarding.
        location /service-one/ {
            proxy_pass http://service_one/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /service-two/ {
            proxy_pass http://service_two/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / { return 404; }
    }
}
