events {}
http {
    # Preserve the signed request body and Host header for AWS SigV4 verification.
    client_max_body_size 10m;
    server {
        listen 9443 ssl;
        ssl_certificate /tls/ca.pem;
        ssl_certificate_key /private-tls/server.key;
        location / {
            proxy_pass https://aws-emulator:9297;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_ssl_server_name on;
            proxy_ssl_name localhost;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /emulator/9297/ca.pem;
        }
    }
}
